name: Product checks
on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      detect-changes:
        type: boolean
        default: false
      full:
        type: boolean
        default: false
    outputs:
      source-sha:
        description: Source checked by the product jobs.
        value: ${{ jobs.quality.outputs.source-sha }}
permissions:
  contents: read
jobs:
  quality:
    name: Lint and types
    uses: xova-dev/actions/.github/workflows/check.yml@dc39d052629065714f5fabd978ed16196bdb7a89
    with:
      source-sha: ${{ inputs.source-sha }}
      detect-changes: ${{ inputs.detect-changes }}
  compatibility:
    needs: quality
    if: needs.quality.outputs.code-changed == 'true'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22.18.0
          - 24.x
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            scripts/compatibility-matrix.json
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/matrix-npm-cache/_cacache
          key: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Packaged compatibility
        # Keep isolated consumers on the checkout volume for pnpm store reuse on Windows.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/matrix-npm-cache
        run: pnpm test:pack --profile ${{ (inputs.full || (matrix.os == 'ubuntu-latest' && matrix.node == '24.x')) && 'full' || (runner.os == 'Linux' && 'daily' || 'platform') }}
  electron:
    needs: quality
    if: needs.quality.outputs.code-changed == 'true'
    name: Electron / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/matrix-electron-cache
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/electron-web/package.json') }}
          restore-keys: |
            electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      # The isolated consumer installs its own locked Electron dependencies.
      - run: pnpm --filter @xova/matrix --fail-if-no-match install --frozen-lockfile
      - name: Install virtual display for Electron
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Dual-product Electron/Web acceptance (Linux)
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          electron_config_cache: ${{ runner.temp }}/matrix-electron-cache
        run: xvfb-run --auto-servernum pnpm test:electron-web
      - name: Dual-product Electron/Web acceptance (macOS / Windows)
        if: runner.os != 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          electron_config_cache: ${{ runner.temp }}/matrix-electron-cache
        run: pnpm test:electron-web
