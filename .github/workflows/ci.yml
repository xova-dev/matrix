name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full host matrix on all OS / Node combinations
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed paths
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          let code = true
          const base = process.env.BASE
          if (base && !/^0+$/.test(base)) {
            const range = process.env.GITHUB_EVENT_NAME === 'pull_request' ? `${base}...HEAD` : `${base}..HEAD`
            const files = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z', range], { encoding: 'utf8' }).split('\0').filter(Boolean)
            const docs = file => file.startsWith('docs/')
              || ['README.md', 'README.zh-CN.md', 'CHANGELOG.md', 'AGENTS.md', 'test/README.md'].includes(file)
              || /^examples\/(?:[^/]+\/)*README(?:\.[^/]+)?\.md$/.test(file)
            code = files.length === 0 || !files.every(docs)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `code=${code}\n`)
          NODE

  quality:
    name: Lint and types
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.code == 'true'
        run: pnpm build
      - if: needs.changes.outputs.code == 'true'
        run: pnpm check:examples
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter matrix-basic-example run doctor
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter matrix-basic-example run test
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter matrix-basic-example run build

  compatibility:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            scripts/compatibility-matrix.json
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/matrix-npm-cache/_cacache
          key: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # prepack builds with this job's exact Node version; use the installed tarball.
      - name: Packaged compatibility
        env:
          npm_config_cache: ${{ runner.temp }}/matrix-npm-cache
        run: pnpm test:pack --profile ${{ (inputs.full || (matrix.os == 'ubuntu-latest' && matrix.node == '24.x')) && 'full' || (runner.os == 'Linux' && 'daily' || 'platform') }}

  electron:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Electron / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/matrix-electron-cache
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/electron-web/package.json') }}
          restore-keys: |
            electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - name: Install virtual display for Electron
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Dual-product Electron/Web acceptance (Linux)
        if: runner.os == 'Linux'
        env:
          electron_config_cache: ${{ runner.temp }}/matrix-electron-cache
        run: xvfb-run --auto-servernum pnpm test:electron-web
      - name: Dual-product Electron/Web acceptance (macOS / Windows)
        if: runner.os != 'Linux'
        env:
          electron_config_cache: ${{ runner.temp }}/matrix-electron-cache
        run: pnpm test:electron-web
