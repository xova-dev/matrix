name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  compatibility:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # prepack builds with this job's exact Node version; use the installed tarball.
      - run: pnpm test:pack
      - name: Install virtual display for Electron
        if: runner.os == 'Linux' && matrix.node == '24.x'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Dual-product Electron/Web acceptance (Linux)
        if: runner.os == 'Linux' && matrix.node == '24.x'
        run: xvfb-run --auto-servernum pnpm test:electron-web
      - name: Dual-product Electron/Web acceptance (macOS / Windows)
        if: runner.os != 'Linux' && matrix.node == '24.x'
        run: pnpm test:electron-web
