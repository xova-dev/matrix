name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: xova-dev/.github/.github/workflows/npm-publish.yml@main
    with:
      verify-command: pnpm check && pnpm test:pack
      publish-command: pnpm publish --access public --no-git-checks

  documentation:
    needs: publish
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
