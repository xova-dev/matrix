name: Publish
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag; run this workflow at the same tag
        type: string
        required: true
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source-sha: ${{ github.sha }}
  release:
    needs: checks
    uses: xova-dev/actions/.github/workflows/release.yml@ef8261ffb66d4593e54a542d035f4684d5124abd
    permissions:
      contents: read
      id-token: write
      pages: write
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      expected-sha: ${{ needs.checks.outputs.source-sha }}
      deploy-docs: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
