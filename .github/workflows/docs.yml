name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
      - .github/workflows/publish.yml
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: Deploy the latest stable release after npm publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ inputs.deploy && 'release' || 'check' }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.deploy }}

jobs:
  build:
    name: Check and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        if: inputs.deploy
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match package.json version')
          }
          NODE
      - run: pnpm docs:typecheck
      - run: pnpm docs:build
      - name: Configure Pages
        if: inputs.deploy
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy documentation to Pages
    if: inputs.deploy && github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          latest_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [ "$RELEASE_TAG" = "$latest_tag" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping deployment: this is not the latest stable release.'
          fi
      - name: Deploy to Pages
        id: deployment
        if: steps.release.outputs.current == 'true'
        uses: actions/deploy-pages@v5
