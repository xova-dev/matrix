name: Documentation
on:
  pull_request:
    paths:
      - docs/**
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
      - .github/workflows/publish.yml
      - .github/workflows/docs-recover.yml
      - .github/xova.json
      - mise.toml
  push:
    branches:
      - main
    paths:
      - docs/**
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
      - .github/workflows/publish.yml
      - .github/workflows/docs-recover.yml
      - .github/xova.json
      - mise.toml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: xova-dev/actions/.github/workflows/check.yml@62e30426bc63933c2d6cf8970c05aad9d150f757
    with:
      kind: docs
      source-sha: ${{ github.sha }}
