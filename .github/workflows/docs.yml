name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
      - .github/workflows/publish.yml
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages:
        description: Save the checked site for deployment after npm publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Check and build documentation
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:typecheck
      - run: pnpm docs:build
      - name: Configure Pages
        if: inputs.upload-pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
